<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; font-src 'self'; media-src 'self' file:; script-src 'self'">
  <title>Stalow Music</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="logo.png" alt=""><span>Stalow Music</span></div>
    <nav>
      <button data-view="home" data-icon="home" class="nav active"><span data-i18n="home">Home</span></button>
      <button data-view="search" data-icon="search" class="nav"><span data-i18n="search">Search</span></button>
      <button data-view="artists" data-icon="artist" class="nav"><span data-i18n="artists">Artists</span></button>
      <button data-view="nowplaying" data-icon="audio" class="nav"><span data-i18n="now_playing">Now playing</span></button>
      <button data-view="queue" data-icon="queue" class="nav"><span data-i18n="queue">Queue</span></button>
      <button data-view="liked" data-icon="heart" class="nav"><span data-i18n="liked_songs">Liked songs</span></button>
      <button data-view="downloads" data-icon="backup" class="nav"><span data-i18n="downloads">Downloads</span></button>
      <button data-view="settings" data-icon="settings" class="nav"><span data-i18n="settings">Settings</span></button>
    </nav>
  </aside>

  <main id="main">
    <div class="topbar"><button id="btn-back" class="back" hidden></button></div>
    <div id="update-banner" class="banner" hidden></div>
    <div id="view"></div>
  </main>

  <footer class="player">
    <div class="now-wrap">
    <button class="now" id="btn-now">
      <span id="np-art-box"></span>
      <span class="np-text"><span id="np-title" class="ellipsis block">Nothing playing</span><span id="np-artist" class="ellipsis muted block"></span></span>
    </button>
    <button id="btn-like" class="like-btn" data-icon="heart" hidden></button>
    </div>
    <div class="controls">
      <div class="buttons">
        <button id="btn-shuffle" class="toggle" data-icon="shuffle" aria-pressed="false"></button>
        <button id="btn-prev" data-icon="prev"></button>
        <button id="btn-play" class="play" data-icon="play"></button>
        <button id="btn-next" data-icon="next"></button>
        <button id="btn-repeat" class="toggle" data-icon="repeat" aria-pressed="false"><span class="badge" id="repeat-badge"></span></button>
      </div>
      <div class="seek"><span id="t-cur">0:00</span><input id="seek" type="range" min="0" max="0" value="0" step="1"><span id="t-dur">0:00</span></div>
    </div>
    <div class="volume"><span data-icon="volume"></span><input id="vol" type="range" min="0" max="1" step="0.01" value="1"></div>
  </footer>
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="nowplaying.js"></script>
  <script src="settings-view.js"></script>
  <script src="start.js"></script>
</body>
</html>
